<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sakaroku</title>
<meta name="description" content="Sakaroku — human-made beats & radio.">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        min-height: 100%;
    }

    body {
        margin: 0;
        background:
            radial-gradient(circle at 50% -10%, #382b42 0%, #1c1821 38%, #100f12 80%);
        color: #eee7dc;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
    }

    .page {
        width: 100%;
        max-width: 570px;
        padding: 70px 22px 60px;
    }

    header {
        text-align: center;
        margin-bottom: 45px;
    }

    .logo {
        margin: 0;
        font-size: 42px;
        font-weight: 400;
        letter-spacing: 9px;
        padding-left: 9px;
    }

    .tagline {
        margin-top: 10px;
        color: #bca98f;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .divider {
        width: 42px;
        height: 1px;
        background: #806f83;
        margin: 28px auto 0;
        opacity: .65;
    }

    .links {
        display: flex;
        flex-direction: column;
        gap: 13px;
    }

    .link {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 68px;
        padding: 0 22px;

        color: #e9e1d8;
        text-decoration: none;

        background: rgba(255,255,255,.045);
        border: 1px solid rgba(231,216,196,.12);
        border-radius: 14px;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        transition:
            transform .18s ease,
            background .18s ease,
            border-color .18s ease,
            box-shadow .18s ease;
    }

    .link:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,.075);
        border-color: rgba(231,216,196,.30);
        box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .icon {
        width: 38px;
        font-size: 19px;
        text-align: center;
        margin-right: 13px;
        color: #c6b59d;
    }

    .text {
        flex: 1;
    }

    .name {
        display: block;
        font-size: 15px;
        letter-spacing: .5px;
    }

    .description {
        display: block;
        margin-top: 2px;
        color: #89818b;
        font-size: 11px;
    }

    .arrow {
        color: #746d77;
        font-size: 15px;
        margin-left: 15px;
    }

    /* YouTube / main button */

    .featured {
        min-height: 78px;
        margin-bottom: 10px;
        background:
            linear-gradient(
                120deg,
                rgba(188,169,143,.13),
                rgba(111,83,126,.14)
            );
        border-color: rgba(202,181,151,.25);
    }

    .featured .name {
        font-size: 16px;
        letter-spacing: 1px;
    }

    .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #bca98f;
        margin-right: 14px;
        box-shadow: 0 0 10px rgba(188,169,143,.65);
    }

    footer {
        margin-top: 38px;
        text-align: center;
        color: #5f5962;
        font-size: 10px;
        letter-spacing: 2px;
    }

    @media (max-width: 500px) {
        .page {
            padding-top: 52px;
            padding-left: 17px;
            padding-right: 17px;
        }

        .logo {
            font-size: 34px;
            letter-spacing: 7px;
            padding-left: 7px;
        }

        .link {
            min-height: 64px;
        }
    }
</style>
</head>

<body>

<main class="page">

<header>
    <h1 class="logo">SAKAROKU</h1>
    <div class="tagline">Human-made beats & radio</div>
    <div class="divider"></div>
</header>

<div class="links">

    <!-- YOUTUBE -->

    <a class="link featured"
       href="https://www.youtube.com/@Sakaroku"
       target="_blank"
       rel="noopener noreferrer">

        <span class="live-dot"></span>

        <span class="text">
            <span class="name">YouTube</span>
            <span class="description">Sakaroku Radio & videos</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- SPOTIFY -->

    <a class="link"
       href="https://open.spotify.com/artist/0kxCmMXOb0omXBHrPDNb0G"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">●</span>

        <span class="text">
            <span class="name">Spotify</span>
            <span class="description">Listen to Sakaroku</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- APPLE MUSIC -->

    <a class="link"
       href="https://music.apple.com/us/artist/sakaroku/6809411984"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">♪</span>

        <span class="text">
            <span class="name">Apple Music</span>
            <span class="description">Listen on Apple Music</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- TIDAL -->

    <a class="link"
       href="https://tidal.com/artist/85571171"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">◇</span>

        <span class="text">
            <span class="name">TIDAL</span>
            <span class="description">Listen on TIDAL</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- INSTAGRAM -->

    <a class="link"
       href="https://instagram.com/sakarokuradio"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">◎</span>

        <span class="text">
            <span class="name">Instagram</span>
            <span class="description">@sakarokuradio</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- X -->

    <a class="link"
       href="https://x.com/sakarokuradio"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">𝕏</span>

        <span class="text">
            <span class="name">X</span>
            <span class="description">@sakarokuradio</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- EMAIL -->

    <a class="link"
       href="mailto:sakaroku@proton.me">

        <span class="icon">✉</span>

        <span class="text">
            <span class="name">Email</span>
            <span class="description">sakaroku@proton.me</span>
        </span>

        <span class="arrow">↗</span>
    </a>

</div>

<footer>
    SAKAROKU
</footer>

</main>

</body>
</html>
