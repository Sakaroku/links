<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sakaroku</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -10%, #382b42 0%, #1c1821 38%, #100f12 80%);
    color: #eee7dc;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
}

.page {
    width: 100%;
    max-width: 570px;
    padding: 65px 22px 70px;
}

header {
    text-align: center;
    margin-bottom: 55px;
}

.logo {
    margin: 0;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 9px;
    padding-left: 9px;
}

.divider {
    width: 42px;
    height: 1px;
    background: #806f83;
    margin: 25px auto 0;
    opacity: .65;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.link {
    display: flex;
    align-items: center;
    min-height: 68px;
    padding: 0 22px;

    color: #e9e1d8;
    text-decoration: none;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(231,216,196,.12);
    border-radius: 14px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.link:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.075);
    border-color: rgba(231,216,196,.30);
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
}

/* ALL ICONS USE EXACTLY THE SAME SPACE */

.icon {
    width: 42px;
    min-width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 12px;

    color: #c6b59d;
    font-size: 19px;
}

.text {
    flex: 1;
}

.name {
    display: block;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
}

.description {
    display: block;
    margin-top: 1px;
    color: #89818b;
    font-size: 11px;
}

.arrow {
    color: #746d77;
    font-size: 15px;
    margin-left: 15px;
}

/* YOUTUBE */

.youtube {
    min-height: 74px;
    background:
        linear-gradient(
            120deg,
            rgba(188,169,143,.10),
            rgba(111,83,126,.11)
        );
    border-color: rgba(202,181,151,.20);
}

.youtube-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #c6b59d;
    box-shadow: 0 0 9px rgba(198,181,157,.45);
}

/* MOBILE */

@media (max-width: 500px) {

    .page {
        padding: 48px 17px 55px;
    }

    .logo {
        font-size: 34px;
        letter-spacing: 7px;
        padding-left: 7px;
    }

    header {
        margin-bottom: 45px;
    }

    .link {
        min-height: 64px;
    }
}
</style>
</head>

<body>

<main class="page">

<header>
    <h1 class="logo">SAKAROKU</h1>
    <div class="divider"></div>
</header>

<div class="links">

    <!-- YOUTUBE -->

    <a class="link youtube"
       href="https://www.youtube.com/@Sakaroku"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">
            <span class="youtube-dot"></span>
        </span>

        <span class="text">
            <span class="name">YouTube</span>
            <span class="description">Sakaroku Radio & videos</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- SPOTIFY -->

    <a class="link"
       href="https://open.spotify.com/artist/0kxCmMXOb0omXBHrPDNb0G"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">●</span>

        <span class="text">
            <span class="name">Spotify</span>
            <span class="description">Listen to Sakaroku</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- APPLE MUSIC -->

    <a class="link"
       href="https://music.apple.com/us/artist/sakaroku/6809411984"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">♪</span>

        <span class="text">
            <span class="name">Apple Music</span>
            <span class="description">Listen on Apple Music</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- TIDAL -->

    <a class="link"
       href="https://tidal.com/artist/85571171"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">◇</span>

        <span class="text">
            <span class="name">TIDAL</span>
            <span class="description">Listen on TIDAL</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- INSTAGRAM -->

    <a class="link"
       href="https://instagram.com/sakarokuradio"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">◎</span>

        <span class="text">
            <span class="name">Instagram</span>
            <span class="description">@sakarokuradio</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- X -->

    <a class="link"
       href="https://x.com/sakarokuradio"
       target="_blank"
       rel="noopener noreferrer">

        <span class="icon">𝕏</span>

        <span class="text">
            <span class="name">X</span>
            <span class="description">@sakarokuradio</span>
        </span>

        <span class="arrow">↗</span>
    </a>


    <!-- EMAIL -->

    <a class="link"
       href="mailto:sakaroku@proton.me">

        <span class="icon">✉</span>

        <span class="text">
            <span class="name">Email</span>
            <span class="description">sakaroku@proton.me</span>
        </span>

        <span class="arrow">↗</span>
    </a>

</div>

</main>

</body>
</html>
